<section class="admin-dashboard page-shell">
  <div class="hero panel">
    <p class="eyebrow">Admin Panel</p>
    <h1>Control Center</h1>
    <p class="intro">
      Manage the operational areas of HAIRCRAFT from one place. Choose a section below to
      continue.
    </p>
  </div>

  <div class="admin-grid">
    @for (card of adminCards; track card.route) {
      <a
        class="admin-card panel"
        [routerLink]="card.route"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="card-label">Admin</span>
        <h2>{{ card.title }}</h2>
        <p>{{ card.description }}</p>
      </a>
    }
  </div>

  <section class="admin-content">
    <router-outlet />
  </section>
</section>
